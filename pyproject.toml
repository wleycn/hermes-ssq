[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssq-predictor"
version = "0.2.0"
description = "双色球历史数据统计分析与时序建模工程（仅供技术学习，开奖为独立随机事件，不提供任何投注建议）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rocky Wang" }]
keywords = ["ssq", "lottery", "machine-learning", "analysis"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "torch>=2.0",
    "joblib>=1.3",
    "requests>=2.30",
    "urllib3>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
ssq = "ml.main:main"

[tool.setuptools]
packages = ["ml", "ml.data", "ml.features", "ml.models", "ml.utils"]

[tool.setuptools.package-data]
ml = ["data/*.csv", "data/*.html"]

[tool.setuptools.dynamic]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
